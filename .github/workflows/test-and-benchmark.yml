name: Build, test, and benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start pinned Redis 7.4
        run: |
          docker compose -f docker-compose.test.yml up --detach --wait
          test -S /tmp/redis.sock

      - name: Configure and build
        run: |
          cmake -S . -B build \
            -DREDIS_ADAPTER_TEST=ON \
            -DREDIS_ADAPTER_BENCHMARK=ON \
            -DCMAKE_CXX_STANDARD=20
          cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Run TCP benchmarks
        run: build/redis-adapter-benchmark
        env:
          REDIS_ADAPTER_BENCHMARK_HOST: 127.0.0.1

      - name: Run Unix-socket benchmarks
        run: build/redis-adapter-benchmark
        env:
          REDIS_ADAPTER_BENCHMARK_HOST: /tmp/redis.sock

      - name: Show Redis logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Stop Redis
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
