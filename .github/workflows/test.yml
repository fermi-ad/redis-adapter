name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository and dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Validate release metadata
        run: |
          VERSION="$(tr -d '\n' < VERSION.txt)"
          grep -F "project(redis-adapter VERSION \${REDIS_ADAPTER_VERSION}" CMakeLists.txt
          grep -F "## [${VERSION}]" CHANGELOG.md
          grep -F "BSD 3-Clause License" LICENSE
          test -r NOTICE
          test -r THIRD_PARTY_NOTICES.md

      - name: Start pinned Redis 7.4
        run: |
          docker compose -f docker-compose.test.yml up --detach --wait
          test -S /tmp/redis.sock

      - name: Configure and build
        run: |
          cmake -S . -B build -DREDIS_ADAPTER_TEST=ON
          cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel 8
        env:
          REDIS_ADAPTER_TEST_PORT: 6379
          REDIS_ADAPTER_TEST_SOCKET: /tmp/redis.sock
          REDIS_ADAPTER_ISOLATED_TEST: 1

      - name: Show Redis logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Stop Redis
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes
